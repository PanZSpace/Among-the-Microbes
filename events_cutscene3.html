<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>คัทซีนอีเวนต์เชื้อ EV11–EV39</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Mitr:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffe27a;--ink:#0e0822;--mint:#7dffc4}
html,body{margin:0;width:100%;height:100%;min-height:100vh;min-height:100dvh;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:none}
#stage{position:relative;width:min(100vw,177.78vh);width:min(100vw,177.78dvh);max-height:100vh;max-height:100dvh;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:#000;font-family:'Mali','Mitr',sans-serif;user-select:none}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.35))}
#tag{position:absolute;left:2.4cqw;top:2cqw;display:none;font:700 clamp(12px,2.4cqw,20px) 'Mitr';color:var(--ink);background:var(--gold);padding:.3cqw 1.4cqw;border:.3cqw solid #fff;box-shadow:.5cqw .5cqw 0 rgba(0,0,0,.6);transform:rotate(-2deg);animation:pop .3s cubic-bezier(.2,2,.4,1)}
@keyframes pop{from{transform:rotate(-2deg) scale(.2)}}
#cap{position:absolute;left:5cqw;right:5cqw;bottom:4cqw;display:none;max-height:40%;overflow-y:auto;padding:1.2cqw 2.2cqw;background:rgba(14,8,34,.9);border:.4cqw solid var(--gold);box-shadow:0 0 0 .4cqw var(--ink);color:#fff;font-weight:700;font-size:clamp(14px,3.1cqw,24px);line-height:1.3;text-align:center}
#bar{position:absolute;left:0;bottom:0;height:.7cqw;background:var(--mint);width:0;display:none}
#skip{position:absolute;right:2cqw;top:2cqw;z-index:5;display:none;min-width:44px;min-height:44px;font:500 clamp(12px,1.8cqw,18px) 'Mitr';color:#fff;background:rgba(0,0,0,.65);border:.2cqw solid rgba(255,255,255,.7);padding:6px 12px;cursor:pointer;touch-action:manipulation}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;padding:12px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:rgba(8,4,24,.72)}
#menu h1{margin:0;font:700 3.2cqw 'Mitr';color:#fff;text-shadow:.4cqw .4cqw 0 #1fa77d}
#menu p{margin:0;font:1.8cqw 'Mali';color:var(--gold)}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5cqw .7cqw}
#grid button{font:500 1.3cqw 'Mitr';text-align:left;padding:.4cqw .9cqw;min-width:0;min-height:44px;width:30cqw;color:#fff;background:#2b1b52;border:.2cqw solid var(--mint);cursor:pointer;touch-action:manipulation}
#grid button:hover,#grid button:focus-visible{background:var(--mint);color:var(--ink);outline:none}
#grid b{color:var(--gold);margin-right:.8cqw}#grid button:hover b{color:#b00040}
@media (orientation:portrait){
  #stage{width:100vw;height:100vh;height:100dvh;max-height:none;aspect-ratio:auto}
  #cv{position:absolute;top:50%;left:0;width:100%;height:auto;aspect-ratio:16/9;transform:translateY(-50%)}
  #tag{left:max(12px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));max-width:calc(100% - 112px);font-size:clamp(12px,3.8vw,18px);padding:4px 8px}
  #cap{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));max-height:28dvh;padding:10px 12px;border-width:2px;box-shadow:0 0 0 2px var(--ink);font-size:clamp(15px,4.2vw,21px);line-height:1.4}
  #bar{height:4px}
  #skip{right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));font-size:clamp(12px,3.4vw,16px)}
  #menu{justify-content:flex-start;gap:10px;padding:max(48px,8dvh) max(16px,env(safe-area-inset-left,0px)) 24px}
  #menu h1{font-size:clamp(20px,6vw,32px)}
  #menu p{font-size:clamp(14px,3.8vw,18px);text-align:center}
  #grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:min(100%,520px)}
  #grid button{width:100%;min-height:48px;padding:7px;font-size:clamp(11px,3.3vw,15px)}
}
@media (hover:none) and (orientation:landscape) and (max-height:520px){#menu{justify-content:flex-start;padding:12px}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="320" height="180"></canvas>
  <div id="tag"></div><div id="cap"></div><div id="bar"></div>
  <button id="skip">ข้าม (Esc) ▸▸</button>
  <div id="menu"><h1>🧫 คัทซีนอีเวนต์ของเชื้อ</h1><p>คลิกเพื่อดูตัวอย่าง · EV11–EV39</p><div id="grid"></div></div>
</div>
<script>
/* ============ CONFIG ============ */
const EMBEDDED=new URLSearchParams(location.search).get('embed')==='1';
const CFG={dur:3,cps:30,sound:true,demoMenu:!EMBEDDED};
function onCutsceneEnd(id){if(EMBEDDED&&window.parent!==window)window.parent.postMessage({type:'among-the-microbes-event-cutscene:end',id},'*')}

/* ============ ตัวช่วยวาด ============ */
const cv=document.getElementById('cv'),x=cv.getContext('2d'),$=id=>document.getElementById(id);
const R=(c,a,b,w,h)=>{x.fillStyle=c;x.fillRect(Math.round(a),Math.round(b),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))};
const hx2=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const hm=(a,b,f)=>{const p=hx2(a),q=hx2(b);return'#'+p.map((v,i)=>(v+(q[i]-v)*f|0).toString(16).padStart(2,'0')).join('')};
const C=(c,cx,cy,r)=>{for(let d=-r;d<=r;d++){const w=Math.sqrt(r*r-d*d);R(c,cx-w,cy+d,w*2,1)}};
const L=(c,a,b,e,f)=>{const n=Math.max(Math.abs(e-a),Math.abs(f-b))|0||1;for(let i=0;i<=n;i++)R(c,a+(e-a)*i/n,b+(f-b)*i/n,1,1)};
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ez=t=>{t=cl(t);return t*t*(3-2*t)},lp=(a,b,f)=>a+(b-a)*f;
const sh=a=>(Math.random()-.5)*a;
function txt(s,a,b,z,c){x.font=`${z}px 'Press Start 2P',monospace`;x.fillStyle='#000';x.fillText(s,a+1,b+1);x.fillStyle=c;x.fillText(s,a,b)}
function fade(a){if(a>0){x.fillStyle=`rgba(5,3,16,${cl(a)})`;x.fillRect(0,0,320,180)}}
function tint(c){x.fillStyle=c;x.fillRect(0,0,320,180)}
function speed(cx,cy,t,c='#fff'){for(let i=0;i<40;i++){const a=i/40*6.2832+Math.sin(t*40+i)*.02,r0=55+(i*13%30),r1=r0+60+(i*7%50);L(c,cx+Math.cos(a)*r0,cy+Math.sin(a)*r0*.7,cx+Math.cos(a)*r1,cy+Math.sin(a)*r1*.7)}}
function heart(a,b,c){R(c,a,b,2,2);R(c,a+3,b,2,2);R(c,a,b+1,5,2);R(c,a+1,b+3,3,1);R(c,a+2,b+4,1,1)}
function sweat(a,b){R('#6fd0ff',a,b,2,3);R('#bfeaff',a,b+3,3,2)}

/* ============ แบคทีเรียตัวเอก ============ */
const HERO={b:'#7dffc4',d:'#2fbf8f',l:'#d8fff0',o:'#0f5a57'};
const PALE={b:'#cfe0da',d:'#8aa59c',l:'#fff',o:'#4a5a66'};
const HOT={b:'#ff9a8a',d:'#d9503f',l:'#ffd9d0',o:'#7a1f1f'};
const ACID={b:'#d6e86a',d:'#9aa82a',l:'#f6ffb0',o:'#5a5a10'};
const PURP={b:'#c4a0ff',d:'#7a4fd0',l:'#f0e4ff',o:'#3a1f7a'};
const pal=(b,d)=>({b,d,l:'#ffffffa0',o:'#1b2a4a'});
function bact(cx,cy,u,t,p,o={}){
  for(let i=0;i<10;i++)R(p.d,cx-12*u-i*u*.8,cy+Math.sin(t*7+i*.8)*u*1.7,u,u);
  R(p.o,cx-13*u,cy-5*u,26*u,10*u);R(p.o,cx-11*u,cy-7*u,22*u,14*u);
  R(p.b,cx-12*u,cy-5*u,24*u,10*u);R(p.b,cx-10*u,cy-6*u,20*u,12*u);
  R(p.l,cx-9*u,cy-5*u,10*u,u);R(p.d,cx+5*u,cy+2*u,3*u,2*u);R(p.d,cx-11*u,cy+3*u,2*u,u);
  const e=o.shock?1.25:1,ew=5*u*e,eh=6*u*e;
  for(const ex of[-8,0]){
    R('#fff',cx+ex*u,cy-5*u,ew,eh);
    const bl=o.blink&&Math.sin(t*3)>.96;
    R('#1b1030',cx+(ex+1)*u+(o.look||0)*u,cy-4*u,(o.shock?2:3)*u,bl?u:(o.shock?3:4)*u);
    R('#fff',cx+(ex+1)*u,cy-4*u,u,u);
    if(o.glass){const g='#bfe9ff';R(g,cx+ex*u-u,cy-6*u,ew+2*u,u);R(g,cx+ex*u-u,cy-5*u+eh,ew+2*u,u);R(g,cx+ex*u-u,cy-6*u,u,eh+2*u);R(g,cx+ex*u+ew,cy-6*u,u,eh+2*u)}
  }
  if(o.glass)R('#bfe9ff',cx-3*u,cy-3*u,3*u,u);
  R('#ff8fb8',cx-10*u,cy+u,3*u,u*1.5);R('#ff8fb8',cx+6*u,cy+u,3*u,u*1.5);
  const m='#3a1030';
  if(o.shock)R(m,cx-3*u,cy+2*u,5*u,3*u);
  else if(o.mood==='sad'){R(m,cx-2*u,cy+3*u,4*u,u);R(m,cx-3*u,cy+4*u,u,u);R(m,cx+2*u,cy+4*u,u,u)}
  else if(o.mood==='smile'){R(m,cx-3*u,cy+2*u,u,u);R(m,cx+2*u,cy+2*u,u,u);R(m,cx-2*u,cy+3*u,4*u,u)}
  else R(m,cx-2*u,cy+3*u,4*u,u);
}
const hero=(t,cx,cy,u,o={})=>bact(cx,cy+Math.sin(t*2)*2,u,t,o.pal||HERO,Object.assign({glass:1,blink:1},o));

/* ============ พื้นหลังน้ำเลี้ยงเชื้อ ============ */
const BUB=Array.from({length:18},(_,i)=>({x:(i*53)%320,sp:10+(i*7)%18,r:1+(i%3),o:(i*41)%200}));
function bg(t,a='#c9fff0',b='#14607f',bub=1){
  for(let y=0;y<180;y+=6)R(hm(a,b,y/180),0,y,320,6);
  for(let i=0;i<30;i++)R('#e8fff8',((i*97+t*(3+i%4))%320),(i*61+Math.sin(t+i)*6)%180,1,1);
  if(bub)BUB.forEach(q=>{const y=190-((t*q.sp+q.o)%200),bx=q.x+Math.sin(t+q.o)*3;R('rgba(255,255,255,.7)',bx,y,q.r*2,q.r*2)});
  R(hm(a,b,.9),0,168,320,12);for(let i=0;i<32;i++)R(hm(a,b,.9),i*10,164+(i*7)%5,10,5);
}
function helix(x0,x1,y,t,amp=8){for(let px=x0;px<=x1;px+=2){const k=px*.22+t*4,a=Math.sin(k)*amp,b=-a;R('#ff6ad5',px,y+a,2,2);R('#6ad5ff',px,y+b,2,2);if(((px-x0)/2|0)%3==0)L('rgba(255,255,255,.55)',px,y+a,px,y+b)}}

/* ============ ตัวช่วยเพิ่มเติม ============ */
const w=(v,m)=>(v%m+m)%m;
const PT=(t,n,c,vx,vy,s=2,k=0)=>{for(let i=0;i<n;i++)R(c,w((i+k)*97+t*vx,320),w((i+k)*61+t*vy,180),s,s)};
const O=(c,cx,cy,r,n=26)=>{for(let i=0;i<n;i++){const a=i/n*6.2832;R(c,cx+Math.cos(a)*r,cy+Math.sin(a)*r*.8,2,2)}};
const MX=(p,f)=>({b:hm(HERO.b,p.b,f),d:hm(HERO.d,p.d,f),l:HERO.l,o:hm(HERO.o,p.o,f)});
const NB=(t,cx,cy,u,b,d,o)=>bact(cx,cy,u,t,pal(b,d),o);
const FD=(a,b,r=3)=>{C('#e0883a',a,b,r);C('#ffb347',a,b-1,r-1)};
const Y=(a,b,c)=>{L(c,a,b,a,b+7);L(c,a,b,a-4,b-5);L(c,a,b,a+4,b-5)};

/* ============ อีเวนต์ EV11–EV39 ============ */
const EV={
EV11:{n:'ความเค็มรอบเซลล์เปลี่ยน',c:'น้ำรอบตัวเค็มจัง... ตัวฉันเริ่มเหี่ยวแล้ว!',s:'fizz',f(t){const f=ez(t/2);
 bg(t,hm('#c9fff0','#e8f4ff',f),hm('#14607f','#5a7a9a',f));
 for(let i=0;i<26;i++){const y=(t*35+i*37)%200-10,a=(i*53)%320;R('#fff',a,y,2,2);R('#bfe9ff',a+2,y+2,1,1)}
 txt('NaCl',24,30,7,'#fff');hero(t,160+sh(f*2),95,3-.8*f,{mood:'sad',shock:t>1.6});if(t>1.2)sweat(184,72+(t*20)%8)}},
EV12:{n:'ออกซิเจนเปลี่ยน',c:'อากาศในน้ำเบาบางลง... หายใจไม่ค่อยออก!',s:'down',f(t){const f=ez((t-.3)/2);
 bg(t,hm('#c9fff0','#7a8fa0',f),hm('#14607f','#1a2a3a',f));
 const n=Math.round(14*(1-f));for(let i=0;i<n;i++)txt('O2',(i*61)%290+10,150-((t*28+i*23)%140),6,'#bff');
 hero(t,160,95,3,{pal:MX(PALE,f),mood:'sad',shock:t>1.4&&t<2.2,look:Math.sin(t*3)>0?1:-1});
 if(t>1)for(let k=0;k<3;k++)R('rgba(255,255,255,.6)',176+k*6,80-((t*20+k*9)%20),2,2)}},
EV13:{n:'รับสัญญาณจากเพื่อนบ้าน',c:'มีเสียงเรียกมาจากเพื่อนบ้าน... กำลังฟังอยู่!',s:'beep',f(t){
 bg(t);NB(t,40,70,1.5,'#ffe27a','#c28a2a',{mood:'smile'});NB(t,290,125,1.5,'#ff9ecb','#c2527f',{mood:'smile'});
 for(let k=0;k<4;k++){const p=(t*.9+k*.25)%1;O(`rgba(255,255,255,${1-p})`,52,70,p*130);O(`rgba(255,226,122,${1-p})`,278,125,p*130)}
 hero(t,160,95,3,{look:Math.sin(t*2)>0?-1:1,mood:'smile'});if(t>.6)txt('?!',150,50,12,'#ffe27a')}},
EV14:{n:'มีสิ่งมีชีวิตตัวเล็กเข้ามากิน',c:'มีตัวเล็กๆ จะมากินฉัน! หนีเร็ว!',s:'alarm',f(t){
 bg(t,'#b9e8d8','#1a4a62');const px=lp(380,110,ez(t/2.6)),py=95+Math.sin(t*5)*4;
 for(let i=0;i<14;i++){const a=i/14*6.2832+t*3;R('#e8b0ff',px+Math.cos(a)*30,py+Math.sin(a)*27,2,3)}
 C('#7a3fa0',px,py,27);C('#d9a0ff',px,py-1,25);C('#a070d0',px+8,py+6,10);C('#fff',px-14,py-9,6);R('#222',px-13,py-8,3,4);
 R('#3a1030',px-26,py+2,10,Math.sin(t*9)>0?9:4);
 hero(t,lp(190,60,ez((t-.4)/1.8)),98+sh(1),3,{shock:1,look:1});if(t>.4)sweat(180-t*30,66+(t*25)%8)}},
EV15:{n:'แบคทีเรียข้างเคียงปล่อยสารยับยั้ง',c:'เพื่อนบ้านปล่อยสารพิษใส่ฉัน! โตไม่ได้แล้ว...',s:'zap',f(t){
 bg(t,'#c9fff0','#14607f');NB(t,262,90,2,'#ff9a7a','#b0502e',{mood:'sad'});
 for(let i=0;i<16;i++){const p=(t*.7+i*.13)%1;R(i%2?'#b36bff':'#7aff6a',lp(235,125,p),90+Math.sin(i*2.1+t*4)*14*p,3,3)}
 const f=ez((t-.6)/1.8);hero(t,115+sh(f*2),92,3,{pal:MX(PURP,f),mood:'sad',shock:t>1.2,look:1});if(t>1)txt('X',100,56,12,'#ff3b5c')}},
EV16:{n:'แย่งชิงอาหาร',c:'อาหารชิ้นนี้ของฉัน! อย่ามาแย่งนะ!',s:'squish',f(t){
 bg(t,'#c9fff0','#14607f');const c=ez(t/1.4),k=t>1.4?sh(3):0,r=Math.max(2,10-t*2.4);
 hero(t,lp(70,128,c)+k,95,3,{look:1,mood:'sad'});NB(t,lp(300,208,c)-k,95,2.4,'#ffe27a','#c28a2a',{shock:1});
 FD(168,100,r);if(t>1.4){txt('GRR!',130,52,10,'#ffe27a');R('rgba(255,255,255,.8)',166,88+sh(6),4,2)}}},
EV17:{n:'เจอสารป้องกันจากร่างกาย',c:'สารป้องกันมาเกาะตัวฉัน... ขยับไม่ออกแล้ว!',s:'whoosh',f(t){
 bg(t,'#f0d0d8','#5a2a40');const f=ez(t/2.2);
 hero(t,160+sh(f*1.5),95,3,{pal:MX(PALE,f*.7),shock:t>.8,mood:'sad'});
 for(let i=0;i<8;i++){const a=i*.785+.3,p=ez((t-i*.12)/1.4),r=lp(150,34,p),ax=160+Math.cos(a)*r,ay=95+Math.sin(a)*r*.7;Y(ax,ay,'#7a5aff');Y(ax+1,ay,'#fff')}}},
EV18:{n:'หาเหล็กได้ยาก',c:'ต้องการเหล็ก... แต่หาไม่เจอเลย!',s:'down',f(t){
 bg(t,'#7a8a98','#1a2230');const x0=130+Math.sin(t*1.1)*30;
 for(const[a,b]of[[270,50],[40,140],[290,130]]){R('#6a6a7a',a,b,10,7);R('#c0c0d0',a,b,10,2);if(Math.sin(t*2+a)>.7)txt('Fe',a-1,b+6,6,'#ffb347')}
 hero(t,x0,95,3-.3*ez(t/3),{look:Math.sin(t*2.2)>0?1:-1,mood:'sad'});if(t>.8)txt('?',x0+8,52,14,'#fff27a');if(t>1.8)sweat(x0+34,70+(t*20)%8)}},
EV19:{n:'กระแสของเหลวพัดผ่าน',c:'ของเหลวพัดแรงมาก... ฉันจะลอยไปแล้ว!',s:'whoosh',f(t){
 bg(t,'#ffd0c0','#8a3040',0);
 for(let i=0;i<30;i++){const y=(i*37)%180,xx=w(i*71+t*(120+i%5*40),420)-60;L('rgba(255,255,255,.55)',xx,y,xx+24+i%4*8,y)}
 hero(t,lp(120,300,ez(t/2.8))+sh(2),95+Math.sin(t*9)*3,3,{shock:1,look:1});PT(t,16,'rgba(255,255,255,.8)',260,0,2,5)}},
EV20:{n:'อากาศเย็นลงเร็ว',c:'หนาวเร็วจัง... ตัวสั่นไปหมดเลย!',s:'fizz',f(t){
 const f=ez(t/1.8);bg(t,hm('#c9fff0','#d8f0ff',f),hm('#14607f','#2a4a8a',f),0);
 for(let i=0;i<30;i++){const y=(t*30+i*29)%190-5,a=w(i*47+Math.sin(t*2+i)*8,320);R('#fff',a,y,2,2);if(i%3==0){R('#fff',a-2,y+1,6,1);R('#fff',a+1,y-2,1,6)}}

function frame(now){
  x.globalAlpha=1;
  if(cur){const t=(now-t0)/1000,e=EV[cur];if(t>=CFG.dur){stop()}else{
    e.f(t);fade(1-t/.25);fade((t-(CFG.dur-.25))/.25);$('bar').style.width=(t/CFG.dur*100)+'%';
    const n=Math.min(e.c.length,Math.floor(Math.max(0,t-.3)*CFG.cps));if(n!==shown){shown=n;$('cap').textContent=e.c.slice(0,n)}}}
  else{idleT+=Math.min(.05,(now-lastNow)/1000);bg(idleT);hero(idleT,160,95,3,{look:Math.sin(idleT)>0?1:-1})}
  lastNow=now;requestAnimationFrame(frame)
}
/* ============ UI ============ */
const ids=Object.keys(EV);
ids.forEach(id=>{const b=document.createElement('button');b.innerHTML=`<b>${id}</b>${EV[id].n}`;b.onclick=e=>{e.stopPropagation();playCutscene(id)};$('grid').appendChild(b)});
$('stage').addEventListener('click',e=>{if(cur&&!e.target.closest('#menu'))stop()});
$('skip').onclick=e=>{e.stopPropagation();stop()};
addEventListener('keydown',e=>{if(cur&&['Escape',' ','Enter'].includes(e.key)){e.preventDefault();stop()}});
if(EMBEDDED){const eventId=new URLSearchParams(location.search).get('event');if(EV[eventId])playCutscene(eventId);else{console.error('Unknown event cutscene:',eventId);if(window.parent!==window)window.parent.postMessage({type:'among-the-microbes-event-cutscene:error',id:eventId},'*')}}
requestAnimationFrame(t=>{lastNow=t;frame(t)});
</script>
</body>
