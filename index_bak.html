<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ฉากหลังพิกเซล – Among the Microbes</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .stage { position: fixed; inset: 0; }
  .stage canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: crisp-edges; image-rendering: pixelated;
  }
  nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 6px; overflow-x: auto;
    background: rgba(0,0,0,.55);
  }
  nav button {
    flex: 0 0 auto; padding: 8px 12px; font: 14px/1 system-ui, "Noto Sans Thai", sans-serif;
    color: #fff; background: #263445; border: 2px solid #5a7089; border-radius: 0; cursor: pointer;
  }
  nav button[aria-pressed="true"] { background: #e8c24a; color: #1a1a1a; border-color: #fff3b0; }
  nav button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<div class="stage"><canvas id="bg" aria-hidden="true"></canvas></div>
<nav id="menu" aria-label="เลือกฉาก"></nav>
<script src="backgrounds.js"></script>
<script>
  const bg = PixelBG.create(document.getElementById('bg'), 'gut');
  const menu = document.getElementById('menu');
  PixelBG.ids.forEach((id) => {
    const b = document.createElement('button');
    b.textContent = PixelBG.names[id];
    b.onclick = () => { bg.set(id); [...menu.children].forEach((x) => x.setAttribute('aria-pressed', x === b)); };
    b.setAttribute('aria-pressed', id === 'gut');
    menu.appendChild(b);
  });
</script>
</body>
</html>
